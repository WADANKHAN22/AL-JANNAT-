<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In & Register | ALJANNAT Luxury Fashion</title>
    <meta name="description" content="Sign in or create an account with ALJANNAT Luxury Fashion." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="icon" href="logo.png" type="image/png" />
  </head>
  <body data-page="login" style="background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); color: #fff; min-height: 100vh; display: flex; flex-direction: column;">
    <header class="site-header" style="background: transparent; border-bottom: 1px solid rgba(212, 175, 55, 0.2);">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="ALJANNAT home">
          <img src="logo.png" alt="ALJANNAT" class="brand-logo" />
          <span class="brand-name" style="color: #fff;">ALJANNAT</span>
        </a>
        <a href="index.html" class="btn btn-outline-gold" style="font-size: 0.8rem;"><i class="fa-solid fa-arrow-left"></i> Return to Storefront</a>
      </div>
    </header>

    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 1rem;">
      <div class="auth-modal-card" style="position: relative; opacity: 1; visibility: visible; width: min(100%, 460px);">
        <div class="auth-tabs">
          <button class="auth-tab active" data-auth-tab="login">Sign In</button>
          <button class="auth-tab" data-auth-tab="register">Register Account</button>
        </div>

        <div class="auth-panel" data-auth-panel="login">
          <h2 style="font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem;">Welcome to ALJANNAT</h2>
          <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Sign in to access saved pieces and private concierge services.</p>
          <div class="auth-form">
            <label class="auth-label">
              <span>Email Address</span>
              <input type="email" id="login-email-page" placeholder="client@aljannat.com" required />
            </label>
            <label class="auth-label">
              <span>Password</span>
              <input type="password" id="login-password-page" placeholder="••••••••" required />
            </label>
            <button class="btn btn-primary btn-block" id="btn-login-page">Sign In</button>
            <div class="auth-message" id="auth-login-message-page"></div>
          </div>
        </div>

        <div class="auth-panel hidden" data-auth-panel="register">
          <h2 style="font-size: 1.5rem; text-align: center; margin-bottom: 0.5rem;">Join ALJANNAT</h2>
          <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Create an account for personalized luxury styling.</p>
          <div class="auth-form">
            <label class="auth-label">
              <span>Full Name</span>
              <input type="text" id="register-name-page" placeholder="Your Name" required />
            </label>
            <label class="auth-label">
              <span>Email Address</span>
              <input type="email" id="register-email-page" placeholder="client@aljannat.com" required />
            </label>
            <label class="auth-label">
              <span>Password</span>
              <input type="password" id="register-password-page" placeholder="••••••••" required minlength="6" />
            </label>
            <label class="auth-label">
              <span>Account Role</span>
              <select id="register-role-page">
                <option value="customer">Private Customer</option>
                <option value="wholesale">Wholesale B2B Partner</option>
                <option value="admin">Administrator</option>
              </select>
            </label>
            <button class="btn btn-primary btn-block" id="btn-register-page">Create Account</button>
            <div class="auth-message" id="auth-register-message-page"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer-bottom" style="text-align: center;">
      <div class="container">
        <p>© 2026 ALJANNAT Luxury Fashion. All rights reserved.</p>
      </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('[data-auth-tab]');
        const panels = document.querySelectorAll('[data-auth-panel]');
        
        tabs.forEach((tab) => {
          tab.addEventListener('click', () => {
            const selected = tab.dataset.authTab;
            tabs.forEach((x) => x.classList.toggle('active', x === tab));
            panels.forEach((panel) => panel.classList.toggle('hidden', panel.dataset.authPanel !== selected));
          });
        });

        document.getElementById('btn-login-page')?.addEventListener('click', () => {
          const email = document.getElementById('login-email-page').value.trim();
          const password = document.getElementById('login-password-page').value.trim();
          const result = AljannatAuth.loginUser(email, password);
          const msg = document.getElementById('auth-login-message-page');
          if (!result.success) {
            msg.textContent = result.message;
            return;
          }
          msg.style.color = 'var(--accent)';
          msg.textContent = 'Success! Redirecting...';
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        });

        document.getElementById('btn-register-page')?.addEventListener('click', () => {
          const name = document.getElementById('register-name-page').value.trim();
          const email = document.getElementById('register-email-page').value.trim();
          const password = document.getElementById('register-password-page').value.trim();
          const role = document.getElementById('register-role-page').value || 'customer';
          const msg = document.getElementById('auth-register-message-page');

          if (!name || !email || password.length < 6) {
            msg.textContent = 'Please fill out all fields with a valid password.';
            return;
          }

          const result = AljannatAuth.createUser(name, email, password, role);
          if (!result.success) {
            msg.textContent = result.message;
            return;
          }
          msg.style.color = 'var(--accent)';
          msg.textContent = 'Account created successfully! Redirecting...';
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        });
      });
    </script>
  </body>
</html>
