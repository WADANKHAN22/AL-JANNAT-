<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart | ALJANNAT</title>
    <meta name="description" content="Your ALJANNAT shopping cart and selected luxury dresses." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body data-page="cart">
    <div class="loading-screen" aria-hidden="true">
      <div class="loader"></div>
    </div>

    <div class="site-shell">
      <header class="site-header">
        <div class="container nav-wrap">
          <a href="index.html" class="brand" aria-label="ALJANNAT home">
            <span class="brand-mark">
              <span class="brand-a">A</span>
              <span class="brand-j">J</span>
            </span>
            <span class="brand-name">ALJANNAT</span>
          </a>
          <div class="nav-actions">
            <button class="icon-btn search-toggle" aria-label="Open search"><i class="fa-solid fa-magnifying-glass"></i></button>
            <a href="wishlist.html" class="icon-btn"><i class="fa-regular fa-heart"></i><span class="count-pill wishlist-count">0</span></a>
            <a href="cart.html" class="icon-btn"><i class="fa-solid fa-bag-shopping"></i><span class="count-pill cart-count">0</span></a>
            <button class="icon-btn theme-toggle" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
          </div>
        </div>
      </header>

      <main class="page-section">
        <div class="container cart-layout">
          <div class="cart-items reveal" id="cart-items"></div>
          <aside class="cart-summary reveal">
            <h2>Order Summary</h2>
            <div class="summary-row"><span>Subtotal</span><strong id="subtotal">$0</strong></div>
            <div class="summary-row"><span>Shipping</span><strong>Free</strong></div>
            <div class="summary-row"><span>Estimated Tax</span><strong>$0</strong></div>
            <div class="summary-row total"><span>Total</span><strong id="total">$0</strong></div>
            <button class="btn btn-primary btn-block">Secure Checkout</button>
          </aside>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container footer-grid">
          <div>
            <a href="index.html" class="brand footer-brand">
              <span class="brand-mark">
                <span class="brand-a">A</span>
                <span class="brand-j">J</span>
              </span>
              <span class="brand-name">ALJANNAT</span>
            </a>
          </div>
        </div>
      </footer>
    </div>

    <div class="search-overlay" id="search-overlay" aria-hidden="true">
      <div class="search-panel">
        <button class="close-search" aria-label="Close search"><i class="fa-solid fa-xmark"></i></button>
        <div class="search-heading">
          <p class="eyebrow">Search dresses</p>
          <h2>Find your perfect look</h2>
        </div>
        <div class="search-input-wrap">
          <input type="text" id="global-search" placeholder="Search by style, collection, or name" />
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="search-results" id="search-results"></div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <button class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

    <script src="js/storage.js"></script>
    <script src="js/products.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/search.js"></script>
    <script src="js/payment.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
